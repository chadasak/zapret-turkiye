name: release

# Builds ZapretTray.exe from source on a clean GitHub runner and publishes it
# as a release asset. The binary is not committed to the repository, so the
# only copy anyone downloads is one whose build log is public.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build ZapretTray.exe
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found at $csc" }
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu /codepage:65001 `
                 "/win32manifest:tray\app.manifest" `
                 /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
                 "/out:ZapretTray.exe" "tray\ZapretTray.cs"
          if ($LASTEXITCODE -ne 0) { throw "compile failed with exit code $LASTEXITCODE" }
          Write-Host "built ZapretTray.exe - $((Get-Item ZapretTray.exe).Length) bytes"

      - name: Package the release archive
        shell: pwsh
        run: |
          $stage = "zapret-turkiye-${{ github.ref_name }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse bin  "$stage\bin"
          Copy-Item -Recurse tray "$stage\tray"
          Copy-Item ZapretTray.exe, install.bat, uninstall.bat, zapret_bypass.bat, zapret_task.cmd, README.md, README.tr.md, LICENSE -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Write-Host "packaged $stage.zip"

      - name: Compute checksums and write release notes
        shell: pwsh
        run: |
          $stage   = "zapret-turkiye-${{ github.ref_name }}"
          $exeHash = (Get-FileHash ZapretTray.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "$stage.zip"   -Algorithm SHA256).Hash.ToLower()
          $exeSize = (Get-Item ZapretTray.exe).Length
          $sha     = "${{ github.sha }}"

          "$exeHash *ZapretTray.exe" | Out-File SHA256SUMS.txt -Encoding ascii
          "$zipHash *$stage.zip"     | Out-File SHA256SUMS.txt -Encoding ascii -Append

          $fence = [string][char]96 + [char]96 + [char]96
          $tick  = [string][char]96

          $notes = @(
            "built from $tick$sha$tick by the release workflow. the build log is public,",
            "so you can see exactly which source produced this binary.",
            "",
            "### files",
            "",
            "| file | sha256 |",
            "| --- | --- |",
            "| ${tick}ZapretTray.exe$tick ($exeSize bytes) | $tick$exeHash$tick |",
            "| $tick$stage.zip$tick | $tick$zipHash$tick |",
            "",
            "### verify what you downloaded",
            "",
            ($fence + "powershell"),
            "Get-FileHash ZapretTray.exe -Algorithm SHA256",
            $fence,
            "",
            "the hash it prints has to match the table above. if it does not, do not run it.",
            "",
            "### note",
            "",
            "${tick}ZapretTray.exe$tick asks for administrator rights and adds a Defender",
            "exclusion for its own folder, because winws.exe needs both. the source for all",
            "of it is in ${tick}tray/$tick and it compiles with the csc.exe that already ships",
            "inside windows."
          ) -join "`n"

          $notes | Out-File release-notes.md -Encoding utf8
          Write-Host $notes

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stage = "zapret-turkiye-${{ github.ref_name }}"
          gh release create "${{ github.ref_name }}" `
             "$stage.zip" "ZapretTray.exe" "SHA256SUMS.txt" `
             --title "${{ github.ref_name }}" `
             --notes-file release-notes.md
